# This VM's Keyhole front door.
# llama.cpp stays on 10.1.1.122. gguf-router and the Discord orchestrator are local.

upstream node_qwen {
    server 10.1.1.122:8081;
    keepalive 8;
}

upstream node_dolphin {
    server 10.1.1.122:8082;
    keepalive 8;
}

upstream gguf_router {
    server 127.0.0.1:9000;
    keepalive 8;
}

upstream discord_orchestrator {
    server 127.0.0.1:8787;
    keepalive 4;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 8000;
    listen [::]:8000;
    listen 8888;
    listen [::]:8888;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/keyhole/certs/cert.pem;
    ssl_certificate_key /etc/keyhole/certs/key.pem;

    root /var/lib/keyhole/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/nodes/qwen/ {
        proxy_pass http://node_qwen/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }

    location /api/nodes/dolphin/ {
        proxy_pass http://node_dolphin/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }

    location /api/router/ {
        proxy_pass http://gguf_router/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }

    location /api/orchestrator/ {
        proxy_pass http://discord_orchestrator/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }
}
