# LAN LLM chat front door.
# llama.cpp nodes + gguf-router (snerloc:9000).
# Keep node upstreams in sync with html/catalog.json.

upstream node_qwen {
    server 10.1.1.122:8081;
    keepalive 8;
}

upstream node_dolphin {
    server 10.1.1.122:8082;
    keepalive 8;
}

upstream gguf_router {
    server 10.1.1.106:9000;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 8000;
    listen [::]:8000;
    listen 8888;
    listen [::]:8888;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/nodes/qwen/ {
        proxy_pass http://node_qwen/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }

    location /api/nodes/dolphin/ {
        proxy_pass http://node_dolphin/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }

    location /api/router/ {
        proxy_pass http://gguf_router/;
        include /etc/nginx/proxy_params.conf;
        gzip off;
    }
}
